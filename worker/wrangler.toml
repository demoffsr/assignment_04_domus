name = "tubus-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Created with `wrangler d1 create tubus`.
[[d1_databases]]
binding = "DB"
database_name = "tubus"
database_id = "2a0fa48d-5ddf-4632-8746-b7ceac68668c"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tubus"

[vars]
ALLOWED_ORIGINS = "https://assignment-04-domus.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:4173"
# Secrets, set with `wrangler secret put <NAME>` (locally: worker/.dev.vars):
#   INVITE_CODE       the shared invite code
#   ADMIN_USERNAMES   comma separated usernames that may remove anyone's book
